<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>もちものチェックリスト | 台湾旅行のしおり</title>
  <meta name="description" content="台湾旅行の荷造りで、持ち物の抜け漏れを防ぐチェックリストです。">
  <meta name="theme-color" content="#f2f5f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1621" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&amp;display=swap">
  <link rel="stylesheet" href="assets/style.css">
  <script src="assets/app.js" defer></script>
</head>
<body data-page="packing" class="line-g">
  <header class="site-header">
    <div class="site-header__inner">
      <a class="brand" href="index.html">台湾旅行のしおり</a>
      <nav class="tabs" aria-label="ページ切り替え">
        <a class="line-bl" href="prep.html">準備</a>
        <a class="line-g" href="packing.html" aria-current="page">もちもの</a>
        <a class="line-r" href="itinerary.html">旅程</a>
      </nav>
    </div>
  </header>

  <main class="page">
    <h1 class="page-title"><span class="badge" aria-hidden="true">持</span>もちものチェックリスト</h1>
    <p class="lead">荷造りの抜け漏れを防ぐためのリストです。バッグに入れたらチェックしてください。</p>

    <div class="progress" aria-live="polite">
      <div class="progress__row"><span>完了した項目</span><strong class="progress__num" data-progress-text>0 / 0</strong></div>
      <progress class="bar" data-progress-bar value="0" max="1" aria-label="完了した項目の割合"></progress>
    </div>

      <section class="group" id="docs" data-group aria-labelledby="docs-title">
        <h2 class="group__title" id="docs-title"><span>貴重品・書類</span><span class="count" data-count></span></h2>
        <ul class="checklist">
          <li>
            <label class="check">
              <input type="checkbox">
              <span class="check__body">
                <span class="check__title">パスポート(全員分)</span>
                <span class="check__note">有効期限をもう一度確認します。</span>
              </span>
            </label>
          </li>
          <li>
            <label class="check">
              <input type="checkbox">
              <span class="check__body">
                <span class="check__title">航空券・予約確認書</span>
                <span class="check__note">スマホに保存し、紙でも1部あると安心です。</span>
              </span>
            </label>
          </li>
          <li>
            <label class="check">
              <input type="checkbox">
              <span class="check__body">
                <span class="check__title">ホテルの予約確認書</span>
                <span class="check__note">住所は繁体字も控えておきます。</span>
              </span>
            </label>
          </li>
          <li>
            <label class="check">
              <input type="checkbox">
              <span class="check__body">
                <span class="check__title">海外旅行保険の証券・連絡先</span>
              </span>
            </label>
          </li>
          <li>
            <label class="check">
              <input type="checkbox">
              <span class="check__body">
                <span class="check__title">現金(日本円・台湾ドル)</span>
                <span class="check__note">台湾ドルは、小額紙幣と硬貨も。</span>
              </span>
            </label>
          </li>
          <li>
            <label class="check">
              <input type="checkbox">
              <span class="check__body">
                <span class="check__title">クレジットカード(2枚以上)</span>
                <span class="check__note">別々の場所に分けて持ちます。</span>
              </span>
            </label>
          </li>
          <li>
            <label class="check">
              <input type="checkbox">
              <span class="check__body">
                <span class="check__title">台湾入国カード(TWAC)の登録完了画面</span>
                <span class="check__note">スクリーンショットで保存しておきます。</span>
              </span>
            </label>
          </li>
          <li>
            <label class="check">
              <input type="checkbox">
              <span class="check__body">
                <span class="check__title">パスポートのコピー</span>
                <span class="check__note">紛失に備えて。スマホで撮影しておくのでも構いません。</span>
              </span>
            </label>
          </li>
          <li>
            <label class="check">
              <input type="checkbox">
              <span class="check__body">
                <span class="check__title">財布・貴重品用のポーチ</span>
                <span class="check__note">夜市など人が多い場所では、体の前で持ちます。</span>
              </span>
            </label>
          </li>
        </ul>
      </section>

      <section class="group" id="clothes" data-group aria-labelledby="clothes-title">
        <h2 class="group__title" id="clothes-title"><span>衣類</span><span class="count" data-count></span></h2>
        <ul class="checklist">
          <li>
            <label class="check">
              <input type="checkbox">
              <span class="check__body">
                <span class="check__title">着替え(日数分)</span>
                <span class="check__note">季節に合わせて厚さを調整します。洗濯するなら少なめでも。</span>
              </span>
            </label>
          </li>
          <li>
            <label class="check">
              <input type="checkbox">
              <span class="check__body">
                <span class="check__title">下着・靴下</span>
              </span>
            </label>
          </li>
          <li>
            <label class="check">
              <input type="checkbox">
              <span class="check__body">
                <span class="check__title">パジャマ</span>
              </span>
            </label>
          </li>
          <li>
            <label class="check">
              <input type="checkbox">
              <span class="check__body">
                <span class="check__title">薄手の羽織りもの</span>
                <span class="check__note">屋内は冷房が強めです。朝晩の冷え対策にも。</span>
              </span>
            </label>
          </li>
          <li>
            <label class="check">
              <input type="checkbox">
              <span class="check__body">
                <span class="check__title">歩きやすい靴</span>
                <span class="check__note">よく歩く旅です。履き慣れたものを。</span>
              </span>
            </label>
          </li>
          <li>
            <label class="check">
              <input type="checkbox">
              <span class="check__body">
                <span class="check__title">折りたたみ傘・レインコート</span>
                <span class="check__note">台北は雨が多く、急に降ることもあります。</span>
              </span>
            </label>
          </li>
          <li>
            <label class="check">
              <input type="checkbox">
              <span class="check__body">
                <span class="check__title">帽子・サングラス</span>
                <span class="check__note">日差しが強い時期に。</span>
              </span>
            </label>
          </li>
        </ul>
      </section>

      <section class="group" id="care" data-group aria-labelledby="care-title">
        <h2 class="group__title" id="care-title"><span>洗面・衛生</span><span class="count" data-count></span></h2>
        <ul class="checklist">
          <li>
            <label class="check">
              <input type="checkbox">
              <span class="check__body">
                <span class="check__title">歯ブラシ・歯みがき粉</span>
                <span class="check__note">台湾のホテルには、置いていないことが多いです。</span>
              </span>
            </label>
          </li>
          <li>
            <label class="check">
              <input type="checkbox">
              <span class="check__body">
                <span class="check__title">ひげそり・くし・ヘアゴム</span>
                <span class="check__note">こちらも置いていないことが多いです。</span>
              </span>
            </label>
          </li>
          <li>
            <label class="check">
              <input type="checkbox">
              <span class="check__body">
                <span class="check__title">シャンプー・ボディソープ(小分け)</span>
                <span class="check__note">ホテルにあることが多いですが、こだわりがあれば持参します。</span>
              </span>
            </label>
          </li>
          <li>
            <label class="check">
              <input type="checkbox">
              <span class="check__body">
                <span class="check__title">スキンケア・化粧品</span>
              </span>
            </label>
          </li>
          <li>
            <label class="check">
              <input type="checkbox">
              <span class="check__body">
                <span class="check__title">コンタクトレンズ・メガネ・洗浄液</span>
              </span>
            </label>
          </li>
          <li>
            <label class="check">
              <input type="checkbox">
              <span class="check__body">
                <span class="check__title">日焼け止め・虫よけ</span>
              </span>
            </label>
          </li>
          <li>
            <label class="check">
              <input type="checkbox">
              <span class="check__body">
                <span class="check__title">ティッシュ・ウェットティッシュ</span>
                <span class="check__note">公衆トイレに紙がないことがあります。</span>
              </span>
            </label>
          </li>
          <li>
            <label class="check">
              <input type="checkbox">
              <span class="check__body">
                <span class="check__title">生理用品(必要な人)</span>
              </span>
            </label>
          </li>
        </ul>
      </section>

      <section class="group" id="gadgets" data-group aria-labelledby="gadgets-title">
        <h2 class="group__title" id="gadgets-title"><span>電子機器</span><span class="count" data-count></span></h2>
        <ul class="checklist">
          <li>
            <label class="check">
              <input type="checkbox">
              <span class="check__body">
                <span class="check__title">スマートフォン・充電ケーブル</span>
              </span>
            </label>
          </li>
          <li>
            <label class="check">
              <input type="checkbox">
              <span class="check__body">
                <span class="check__title">モバイルバッテリー</span>
                <span class="check__note">1人2個まで、160Wh以下。預け荷物には入れず、機内持ち込みのみです。機内では使わず、充電もしません(2026年4月から)。端子はテープや袋で保護します。航空会社のルールも確認を。</span>
              </span>
            </label>
          </li>
          <li>
            <label class="check">
              <input type="checkbox">
              <span class="check__body">
                <span class="check__title">USB充電器(複数口)</span>
                <span class="check__note">家族の分をまとめて充電できると便利です。プラグは日本と同じA/Bタイプ。</span>
              </span>
            </label>
          </li>
          <li>
            <label class="check">
              <input type="checkbox">
              <span class="check__body">
                <span class="check__title">イヤホン</span>
              </span>
            </label>
          </li>
          <li>
            <label class="check">
              <input type="checkbox">
              <span class="check__body">
                <span class="check__title">カメラ・メモリーカード</span>
              </span>
            </label>
          </li>
          <li>
            <label class="check">
              <input type="checkbox">
              <span class="check__body">
                <span class="check__title">ポケットWi-Fi・SIMピン(手配した人)</span>
                <span class="check__note">eSIMは、設定に使うQRコードも保存しておきます。</span>
              </span>
            </label>
          </li>
        </ul>
      </section>

      <section class="group" id="health" data-group aria-labelledby="health-title">
        <h2 class="group__title" id="health-title"><span>薬・健康</span><span class="count" data-count></span></h2>
        <ul class="checklist">
          <li>
            <label class="check">
              <input type="checkbox">
              <span class="check__body">
                <span class="check__title">常備薬(胃腸薬・頭痛薬・風邪薬)</span>
              </span>
            </label>
          </li>
          <li>
            <label class="check">
              <input type="checkbox">
              <span class="check__body">
                <span class="check__title">持病の薬(日数分と予備)</span>
                <span class="check__note">機内持ち込みの手荷物に入れます。</span>
              </span>
            </label>
          </li>
          <li>
            <label class="check">
              <input type="checkbox">
              <span class="check__body">
                <span class="check__title">絆創膏・靴ずれ用パッド</span>
              </span>
            </label>
          </li>
          <li>
            <label class="check">
              <input type="checkbox">
              <span class="check__body">
                <span class="check__title">酔い止め</span>
                <span class="check__note">バスや山道の移動に。</span>
              </span>
            </label>
          </li>
          <li>
            <label class="check">
              <input type="checkbox">
              <span class="check__body">
                <span class="check__title">マスク(あれば)</span>
              </span>
            </label>
          </li>
        </ul>
      </section>

      <section class="group" id="flight" data-group aria-labelledby="flight-title">
        <h2 class="group__title" id="flight-title"><span>機内・移動</span><span class="count" data-count></span></h2>
        <ul class="checklist">
          <li>
            <label class="check">
              <input type="checkbox">
              <span class="check__body">
                <span class="check__title">機内で使うもの(本・ダウンロード済みの動画・ゲーム)</span>
              </span>
            </label>
          </li>
          <li>
            <label class="check">
              <input type="checkbox">
              <span class="check__body">
                <span class="check__title">ネックピロー・アイマスク(あれば)</span>
              </span>
            </label>
          </li>
          <li>
            <label class="check">
              <input type="checkbox">
              <span class="check__body">
                <span class="check__title">液体物は100ml以下の容器で、透明な袋に入れる</span>
                <span class="check__note">国際線の手荷物ルールです。合計1L以内。大きい容器は、預け荷物へ。</span>
              </span>
            </label>
          </li>
          <li>
            <label class="check">
              <input type="checkbox">
              <span class="check__body">
                <span class="check__title">機内持ち込み用のリュックやサブバッグ</span>
              </span>
            </label>
          </li>
        </ul>
      </section>

      <section class="group" id="handy" data-group aria-labelledby="handy-title">
        <h2 class="group__title" id="handy-title"><span>あると便利</span><span class="count" data-count></span></h2>
        <ul class="checklist">
          <li>
            <label class="check">
              <input type="checkbox">
              <span class="check__body">
                <span class="check__title">折りたたみエコバッグ</span>
                <span class="check__note">レジ袋が有料の店が多いです。お土産の仕分けにも。</span>
              </span>
            </label>
          </li>
          <li>
            <label class="check">
              <input type="checkbox">
              <span class="check__body">
                <span class="check__title">ジップ付きの袋</span>
                <span class="check__note">濡れた物や、お土産の仕分けに。</span>
              </span>
            </label>
          </li>
          <li>
            <label class="check">
              <input type="checkbox">
              <span class="check__body">
                <span class="check__title">ハンカチ・小さめのタオル</span>
              </span>
            </label>
          </li>
          <li>
            <label class="check">
              <input type="checkbox">
              <span class="check__body">
                <span class="check__title">スーツケースの名札・ベルト</span>
              </span>
            </label>
          </li>
          <li>
            <label class="check">
              <input type="checkbox">
              <span class="check__body">
                <span class="check__title">お土産用の空きスペース(折りたたみバッグ)</span>
                <span class="check__note">帰りは荷物が増えます。</span>
              </span>
            </label>
          </li>
        </ul>
      </section>

    <div class="reset-row">
      <button type="button" class="btn" data-reset>チェックをすべて外す</button>
    </div>

    <p class="page-foot">モバイルバッテリーの新ルールは、<a href="https://www.mlit.go.jp/report/press/kouku10_hh_000310.html" target="_blank" rel="noopener">国土交通省の案内</a>で確認できます。</p>

    <p class="page-foot">チェックの状態は、この端末のブラウザに保存されます。家族の端末とは共有されません。</p>
  </main>
</body>
</html>
